name: invotek
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds localization support for the Flutter framework.
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  dio: ^5.8.0+1
  retrofit: ^4.6.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  pretty_dio_logger: ^1.4.0
  get_it: ^7.6.0
  flutter_bloc:
  shared_preferences: ^2.2.2
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^3.2.2
  path_provider: ^2.1.4
  flutter_zoom_drawer: ^3.2.0
  flutter_slidable: ^3.1.0
  uuid: ^4.5.1
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  get: ^4.6.6
  google_sign_in: ^7.2.0
  # New dependencies for enhanced invoice features
  share_plus: ^7.2.1
  printing: ^5.11.1
  pdf: ^3.10.4
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  # image picker
  # Printing packages
  quick_print: ^1.0.0
  flutter_net_printer: ^1.0.0
  permission_handler: ^12.0.1

  # SUNMI Printer Support
  sunmi_printer_plus: ^4.1.1
  flutter_pos_printer_platform_image_3_sdt: ^1.2.12

  # Bluetooth Printer Support
  bluetooth_print_plus:

  # OTP Input Package
  pinput: ^5.0.2
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.0
  freezed: ^3.2.0
  flutter_native_splash: ^2.4.1
  intl_utils: ^2.8.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai/Almarai-ExtraBold.ttf
          weight: 800

    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/MontserratAlternates/MontserratAlternates-Regular.ttf
        - asset: assets/fonts/MontserratAlternates/MontserratAlternates-Bold.ttf
          weight: 700
        - asset: assets/fonts/MontserratAlternates/MontserratAlternates-Light.ttf
          weight: 300
        - asset: assets/fonts/MontserratAlternates/MontserratAlternates-ExtraBold.ttf
          weight: 800
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Light.ttf
          weight: 300

# flutter_intl configuration
flutter_intl:
  enabled: true

# flutter_native_splash configuration
flutter_native_splash:
  image: assets/images/logo_white.png
  color: "#1E8E3E"
  android: true
  ios: true
  web: false
